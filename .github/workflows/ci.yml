name: PyRunner CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-and-verify:
    name: Build and verify (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Show .NET information
        run: dotnet --info

      - name: Locate Windows App SDK build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found on the GitHub-hosted Windows runner."
          }

          $vswhereVersion = ((& $vswhere -version) | Select-Object -First 1).Trim()
          $installationsJson = (& $vswhere -all -products * -requires Microsoft.Component.MSBuild -format json -utf8) -join "`n"
          $installations = @($installationsJson | ConvertFrom-Json)
          if ($installations.Count -eq 0) {
            throw "No Visual Studio installation containing MSBuild was found."
          }

          $requiredFiles = @(
            "Microsoft.AppxPackage.Targets"
            "Microsoft.Build.AppxPackage.dll"
            "Microsoft.Build.Packaging.Pri.Tasks.dll"
          )
          $candidates = foreach ($installation in $installations) {
            $visualStudioRoot = Join-Path $installation.installationPath "MSBuild\Microsoft\VisualStudio"
            if (-not (Test-Path -LiteralPath $visualStudioRoot -PathType Container)) {
              continue
            }

            foreach ($versionDirectory in Get-ChildItem -LiteralPath $visualStudioRoot -Directory -Filter "v*") {
              $version = $null
              if (-not [Version]::TryParse($versionDirectory.Name.Substring(1), [ref]$version)) {
                continue
              }

              $appxPath = Join-Path $versionDirectory.FullName "AppxPackage"
              $isValid = (Test-Path -LiteralPath $appxPath -PathType Container) -and
                (@($requiredFiles | Where-Object { -not (Test-Path -LiteralPath (Join-Path $appxPath $_) -PathType Leaf) }).Count -eq 0)
              if ($isValid) {
                [pscustomobject]@{
                  AppxVersion = $version
                  InstallationVersion = [Version]$installation.installationVersion
                  VisualStudioVersion = $installation.catalog.productDisplayVersion
                  Path = $appxPath
                }
              }
            }
          }

          $selected = $candidates | Sort-Object -Property `
            @{ Expression = "AppxVersion"; Descending = $true }, `
            @{ Expression = "InstallationVersion"; Descending = $true } | Select-Object -First 1
          if ($null -eq $selected) {
            throw "No valid AppxPackage directory was found under the Visual Studio MSBuild roots. Required files: $($requiredFiles -join ', ')."
          }

          $appxTools = $selected.Path.TrimEnd("\") + "\"
          Write-Host "vswhere version: $vswhereVersion"
          Write-Host "Visual Studio version: $($selected.VisualStudioVersion)"
          Write-Host "AppxMSBuildToolsPath: $appxTools"
          "AppxMSBuildToolsPath=$appxTools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore PyRunner with locked dependencies
        run: dotnet restore .\PyRunner\PyRunner.csproj --locked-mode -p:Platform=x64

      - name: Restore verification projects
        run: dotnet restore .\PyRunner.Verification\PyRunner.Verification.csproj --locked-mode -p:Platform=x64

      - name: Build PyRunner (Release x64)
        run: dotnet build .\PyRunner\PyRunner.csproj -c Release -p:Platform=x64 --no-restore

      - name: Build PyRunner.Verification
        run: dotnet build .\PyRunner.Verification\PyRunner.Verification.csproj -c Debug -p:Platform=x64 --no-restore

      - name: Run PyRunner.Verification
        run: dotnet run --project .\PyRunner.Verification\PyRunner.Verification.csproj -c Debug -p:Platform=x64 --no-build --no-restore

      - name: Verify terminal vendor manifest hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetRoot = Join-Path $PWD "PyRunner\Terminal\wwwroot"
          $manifestPath = Join-Path $assetRoot "vendor-manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $verified = 0

          foreach ($package in $manifest.packages) {
            foreach ($file in $package.files) {
              $assetPath = Join-Path $assetRoot $file.path
              if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
                throw "Vendored terminal asset is missing: $($file.path)"
              }

              $actual = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash
              if ($actual -cne $file.sha256.ToUpperInvariant()) {
                throw "SHA-256 mismatch for vendored terminal asset: $($file.path)"
              }

              $verified++
            }
          }

          if ($verified -eq 0) {
            throw "The terminal vendor manifest did not contain any files."
          }

          Write-Host "Verified $verified vendored terminal asset hashes."

      - name: Confirm tracked files are unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          $status = @(git status --short)
          if ($status.Count -ne 0) {
            $status | Write-Error
            throw "The workflow modified files in the checkout."
          }
