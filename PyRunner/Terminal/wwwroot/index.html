<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyRunner Terminal</title>
    <link rel="stylesheet" href="xterm.css" />
    <script>
        const initialTheme = new URLSearchParams(window.location.search).get('theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = initialTheme;
    </script>
    <style>
        :root {
            --terminal-background: #0f1215;
            color-scheme: dark;
        }

        :root[data-theme="light"] {
            --terminal-background: #f6f8fa;
            color-scheme: light;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--terminal-background);
            overflow: hidden;
        }

        #terminal-shell {
            width: 100%;
            height: 100%;
            padding: 12px 16px;
            box-sizing: border-box;
        }

        #terminal {
            width: 100%;
            height: 100%;
        }

        .xterm-viewport::-webkit-scrollbar {
            width: 8px;
        }

        .xterm-viewport::-webkit-scrollbar-thumb {
            background: #59636d80;
            border-radius: 4px;
        }

        .xterm-viewport::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="terminal-shell"><div id="terminal"></div></div>
    <script src="xterm.js"></script>
    <script src="xterm-addon-fit.js"></script>
    <script src="terminal.js"></script>
</body>
</html>
